security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
        ROLE_SUPER_ADMIN: ROLE_ADMIN

    firewalls:
        dev:
            pattern: ^/_(profiler|wdt)
            security: false

        api:
            pattern: ^/
            stateless: true

            # Limitation des tentatives de connexion.
            #
            # ApiRateLimitSubscriber ne filtre que les chemins commençant par
            # /api/ : /auth n'était couvert par AUCUNE limite, donc ouvert au
            # bourrinage de mots de passe. `login_throttling` est le mécanisme
            # natif de Symfony ; il compte par couple IP + identifiant, et
            # cinq fois moins largement par IP seule.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            json_login:
                check_path: /auth
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            jwt: ~
            custom_authenticators:
                - App\Security\ApiKeyAuthenticator

    access_control:
        # ORDRE IMPORTANT : du plus spécifique au plus général
        - { path: ^/auth, roles: PUBLIC_ACCESS }
        # On autorise l'accès public à la vérification 2FA car le token temporaire est vérifié par le contrôleur/firewall
        # Mais pour être plus sécure, on peut demander IS_AUTHENTICATED_ANONYMOUSLY ou PUBLIC_ACCESS et laisser le contrôleur gérer
        # Ou mieux : on s'assure que le token temporaire donne bien un accès suffisant.
        # Ici, je mets PUBLIC_ACCESS pour éviter le 403 du firewall, la sécurité sera gérée par le token JWT valide
        - { path: ^/api/2fa/login/verify, roles: PUBLIC_ACCESS }

        - { path: ^/api/media_objects, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/users, roles: PUBLIC_ACCESS, methods: [POST] }
        # Défense en profondeur : la liste des comptes est aussi verrouillée au
        # niveau de l'entité (User::GetCollection), mais la règle générique
        # « ^/api en GET = public » ci-dessous laissait passer la requête
        # jusqu'à la couche de sérialisation. On la bloque dès le pare-feu.
        - { path: ^/api/users, roles: IS_AUTHENTICATED_FULLY, methods: [GET] }
        - { path: ^/api/me, roles: ROLE_USER }
        - { path: ^/api/2fa/setup, roles: ROLE_USER }
        - { path: ^/api/2fa/enable, roles: ROLE_USER }
        - { path: ^/api/2fa/disable, roles: ROLE_USER }
        - { path: ^/api/2fa/status, roles: ROLE_USER }
        # Autorise les requêtes GET sur l'API pour tout le monde
        - { path: ^/api, roles: PUBLIC_ACCESS, methods: [GET] }
        # Bloque le reste de l'API pour les non-authentifiés
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
