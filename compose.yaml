services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    volumes:
      - ./:/var/www/html
    # On laisse Symfony utiliser le .env.local via le volume monté,
    # mais on définit quand même une valeur par défaut compatible ici au cas où.
    environment:
      DATABASE_URL: mysql://${MARIADB_USER:-symfony}:${MARIADB_PASSWORD:-PASSWORD}@symfony-db-2025:3306/${MARIADB_DATABASE:-symfony}?serverVersion=${MARIADB_VERSION:-10.8.8-MariaDB}&charset=utf8mb4
    depends_on:
      symfony-db-2025:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

###> doctrine/doctrine-bundle ###
  symfony-db-2025:
    image: mariadb:${MARIADB_VERSION:-10.8.8}
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-symfony}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-PASSWORD}
      MARIADB_USER: ${MARIADB_USER:-symfony}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/mysql:rw
###< doctrine/doctrine-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
